name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build and Test
        run: ./gradlew build
      - name: Run Lint (Spotless)
        run: ./gradlew spotlessCheck
      - name: Run Lint
        run: ./gradlew lint
      - name: Check coverage
        run: ./gradlew jacocoTestReport
